<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Annotated overhead illustration of an LPG carrier">
  <rect x="0" y="0" width="700" height="420" fill="#DFF6FA"/>

  <!-- vessel silhouette -->
  <g transform="translate(90,140)">
    <path d="M 0 40 L 30 12 Q 55 -8 95 -8 L 400 -8 Q 428 -8 442 8 L 456 40
             L 442 72 Q 428 88 400 88 L 95 88 Q 55 88 30 68 Z"
          fill="#173F49" stroke="#0d2b32" stroke-width="2"/>

    <!-- superstructure (aft) -->
    <rect x="378" y="0" width="60" height="80" rx="3" fill="#123E48" stroke="#0d2b32" stroke-width="1.5"/>

    <!-- spherical containment tanks (Moss-type) -->
    <circle cx="140" cy="40" r="34" fill="#2E7C89" stroke="#0d2b32" stroke-width="1.5"/>
    <circle cx="140" cy="40" r="34" fill="none" stroke="#F8FCFD" stroke-width="1" opacity="0.5"/>
    <circle cx="230" cy="40" r="34" fill="#2E7C89" stroke="#0d2b32" stroke-width="1.5"/>
    <circle cx="230" cy="40" r="34" fill="none" stroke="#F8FCFD" stroke-width="1" opacity="0.5"/>
    <circle cx="320" cy="40" r="34" fill="#2E7C89" stroke="#0d2b32" stroke-width="1.5"/>
    <circle cx="320" cy="40" r="34" fill="none" stroke="#F8FCFD" stroke-width="1" opacity="0.5"/>

    <!-- bow taper shading -->
    <path d="M 0 40 L 30 12 L 30 68 Z" fill="#0d2b32" opacity="0.35"/>
  </g>

  <!-- bounding box -->
  <rect x="120" y="128" width="426" height="112" fill="none" stroke="#E76F51" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- length -->
  <line x1="120" y1="256" x2="546" y2="256" stroke="#E76F51" stroke-width="1.5"/>
  <line x1="120" y1="248" x2="120" y2="264" stroke="#E76F51" stroke-width="1.5"/>
  <line x1="546" y1="248" x2="546" y2="264" stroke="#E76F51" stroke-width="1.5"/>
  <text x="333" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#123E48" font-weight="600">LOA (estimated)</text>

  <!-- beam -->
  <line x1="564" y1="128" x2="564" y2="240" stroke="#E76F51" stroke-width="1.5"/>
  <line x1="556" y1="128" x2="572" y2="128" stroke="#E76F51" stroke-width="1.5"/>
  <line x1="556" y1="240" x2="572" y2="240" stroke="#E76F51" stroke-width="1.5"/>
  <text x="582" y="188" writing-mode="vertical-rl" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#123E48" font-weight="600">BEAM</text>

  <!-- callouts -->
  <line x1="230" y1="140" x2="230" y2="108" stroke="#123E48" stroke-width="1"/>
  <text x="230" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#123E48">Spherical containment tanks</text>

  <line x1="408" y1="140" x2="408" y2="108" stroke="#123E48" stroke-width="1"/>
  <text x="408" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#123E48">Superstructure (aft)</text>

  <text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#2E7C89">CASE 02 — ANNOTATED FEATURES (ILLUSTRATIVE)</text>
  <text x="20" y="400" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2E7C89">Note: containment geometry varies — cylindrical, spherical, and membrane-type arrangements are not visually interchangeable.</text>
</svg>
