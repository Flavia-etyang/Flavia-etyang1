<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SAR imagery placeholder">
  <defs>
    <pattern id="speckle" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#123E48"/>
      <circle cx="1.5" cy="1.5" r="0.6" fill="#2E7C89" opacity="0.6"/>
      <circle cx="4" cy="4" r="0.5" fill="#0d2b32" opacity="0.7"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="400" height="260" fill="url(#speckle)"/>
  <rect x="0" y="0" width="400" height="260" fill="none" stroke="#123E48" stroke-width="2"/>

  <!-- bright vessel return, characteristic of SAR -->
  <g transform="translate(90,110)">
    <path d="M 0 20 L 14 4 Q 30 -4 55 -4 L 190 -4 Q 205 -4 212 6 L 220 20 L 212 34 Q 205 44 190 44 L 55 44 Q 30 44 14 36 Z"
          fill="#F8FCFD" opacity="0.9"/>
    <rect x="165" y="2" width="32" height="34" fill="#DFF6FA" opacity="0.95"/>
  </g>

  <text x="200" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#F8FCFD" font-weight="700">SAR</text>
  <text x="200" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#B5E0E8">PLACEHOLDER — NOT ACTUAL IMAGERY</text>
</svg>
