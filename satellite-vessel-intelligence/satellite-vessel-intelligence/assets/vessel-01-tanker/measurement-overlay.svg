<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Measurement reference placeholder">
  <defs>
    <pattern id="measGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#B5E0E8" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="400" height="260" fill="#F8FCFD"/>
  <rect x="0" y="0" width="400" height="260" fill="url(#measGrid)"/>
  <rect x="0" y="0" width="400" height="260" fill="none" stroke="#123E48" stroke-width="2"/>

  <g transform="translate(90,110)">
    <path d="M 0 20 L 14 4 Q 30 -4 55 -4 L 190 -4 Q 205 -4 212 6 L 220 20 L 212 34 Q 205 44 190 44 L 55 44 Q 30 44 14 36 Z"
          fill="#173F49"/>
    <rect x="165" y="2" width="32" height="34" fill="#0d2b32"/>
  </g>

  <!-- bounding box -->
  <rect x="88" y="102" width="134" height="46" fill="none" stroke="#E76F51" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- length line -->
  <line x1="88" y1="162" x2="222" y2="162" stroke="#E76F51" stroke-width="1.5"/>
  <line x1="88" y1="156" x2="88" y2="168" stroke="#E76F51" stroke-width="1.5"/>
  <line x1="222" y1="156" x2="222" y2="168" stroke="#E76F51" stroke-width="1.5"/>
  <text x="155" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#123E48">LOA</text>

  <!-- beam line -->
  <line x1="236" y1="102" x2="236" y2="148" stroke="#E76F51" stroke-width="1.5"/>
  <line x1="230" y1="102" x2="242" y2="102" stroke="#E76F51" stroke-width="1.5"/>
  <line x1="230" y1="148" x2="242" y2="148" stroke="#E76F51" stroke-width="1.5"/>
  <text x="250" y="128" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#123E48">BEAM</text>

  <text x="200" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#123E48" font-weight="700">MEASUREMENT</text>
  <text x="200" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#2E7C89">REFERENCE OVERLAY — ILLUSTRATIVE</text>
</svg>
